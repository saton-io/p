<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kumpulan video viral🤤</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
            touch-action: manipulation;
        }

        .background {
            position: fixed;
            inset: -30px;
            background-image: url("./background.jpg");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            filter: blur(14px);
            transform: scale(1.05);
            z-index: 0;
        }

        .background::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
        }

        .cookie-box {
            position: fixed;
            left: 50%;
            bottom: 25px;
            transform: translateX(-50%);
            width: min(90%, 420px);
            padding: 22px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
            z-index: 10;
        }

        .cookie-box h3 {
            margin: 0 0 8px;
            font-size: 18px;
            color: #111;
        }

        .cookie-box p {
            margin: 0 0 18px;
            color: #555;
            font-size: 14px;
            line-height: 1.5;
        }

        button {
            width: 100%;
            border: 0;
            padding: 13px;
            border-radius: 9px;
            background: #111;
            color: white;
            font-size: 15px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover { opacity: 0.85; }
        button:active { transform: scale(0.98); }

        #video {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            background: #000;
            z-index: 9999;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #video::-webkit-media-controls { display: none !important; }
        #video::-webkit-media-controls-enclosure { display: none !important; }
        #video::-webkit-media-controls-panel { display: none !important; }
        #video::-webkit-media-controls-play-button { display: none !important; }
        #video::-webkit-media-controls-start-playback-button { display: none !important; }
    </style>
</head>

<body>
    <div class="background"></div>
    <div class="cookie-box" id="cookieBox">
        <h3>🍪 Cookies</h3>
        <p>
            We use cookies to improve your experience.
            Click "Accept Cookies" to continue.
        </p>
        <button id="accept">Accept Cookies</button>
    </div>

    <video id="video" playsinline webkit-playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback">
        <source src="video.mp4" type="video/mp4">
        Browser kamu tidak mendukung video.
    </video>

    <script>
        const button = document.getElementById("accept");
        const cookieBox = document.getElementById("cookieBox");
        const video = document.getElementById("video");

        button.addEventListener("click", async () => {
            cookieBox.style.display = "none";
            video.style.display = "block";
            try {
                await video.play();
                if (video.requestFullscreen) await video.requestFullscreen();
                else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
            } catch { }
        });

        video.addEventListener("contextmenu", event => { event.preventDefault(); });
        document.addEventListener("gesturestart", event => { event.preventDefault(); });
        document.addEventListener("gesturechange", event => { event.preventDefault(); });
        document.addEventListener("gestureend", event => { event.preventDefault(); });

        video.controls = false;
    </script>
</body>
</html>
